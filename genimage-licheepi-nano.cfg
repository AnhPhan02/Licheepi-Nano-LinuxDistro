# genimage-licheepi-nano.cfg

# === Partition 1: FAT32 boot partition ===
image boot.vfat {
    vfat {
        files = {
            "zImage",
            "suniv-f1c100s-licheepi-nano.dtb"
        }
    }
    size = 64M
}

# === Partition 2: ext4 rootfs partition ===
image rootfs.ext4 {
    ext4 {
        use-mke2fs = true
    }
    mountpoint = "/"
    size = 512M
}

# === Final SD card image ===
image sdcard.img {
    hdimage {
        partition-table-type = "mbr"
    }

    # U-Boot SPL — raw write tại offset 8KB, KHÔNG nằm trong partition table
    partition u-boot {
        image = "u-boot-sunxi-with-spl.bin"
        offset = 8K
        size = 1016K       
        in-partition-table = false
    }

    # Boot partition (FAT32)
    partition boot {
        partition-type = 0x0C  # FAT32
        bootable = true
        image = "boot.vfat"
        offset = 1M
        size = 64M
    }

    # Rootfs partition (ext4)
    partition rootfs {
        partition-type = 0x83  # Linux
        image = "rootfs.ext4"
        offset = 65M
    }
    size = 600M
}
